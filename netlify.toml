[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# API function redirect — MUST come before the SPA catch-all
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA routing — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
