# KetoPlanner - GitLab CI/CD Pipeline
# Deploys frontend to GitLab Pages (free hosting)
# Backend (with LLM) requires a VPS — see DEPLOYMENT_README.md

stages:
  - build
  - deploy

variables:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

# ---- BUILD FRONTEND ----
frontend-build:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm install --no-frozen-lockfile
    - pnpm build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# ---- DEPLOY TO GITLAB PAGES (FREE HOSTING) ----
pages:
  stage: deploy
  image: node:${NODE_VERSION}
  only:
    - main
  script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm install --no-frozen-lockfile
    - pnpm build
    - mv dist/ public/
  artifacts:
    paths:
      - public/
  environment:
    name: production
    url: https://alaber.gitlab.io/keto-planner

# ---- VERIFY BACKEND BUILDS ----
backend-verify:
  stage: build
  image: node:${NODE_VERSION}
  only:
    - main
  script:
    - cd server
    - npm install --production
    - echo "✅ Backend dependencies installed successfully"
  cache:
    key: ${CI_COMMIT_REF_SLUG}-server
    paths:
      - server/node_modules/
