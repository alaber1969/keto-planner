# Render Blueprint — free Docker web service for ketoai.app
# Docs: https://render.com/docs/blueprint-spec
#
# The Express server serves both the prerendered frontend (dist/) and
# /api/generate-meal-plan, so this is a single-service deployment.
services:
  - type: web
    name: ketoai
    runtime: docker
    plan: free
    # Closest Render region to Australia/Asia. Other options: oregon, ohio,
    # virginia, frankfurt. Region cannot be changed after creation.
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_PROVIDER
        value: deepseek
      # DeepSeek API key. Prompted for during Blueprint creation; never stored
      # in the repo. LLM_API_KEY also works if you switch back to OpenAI.
      - key: LLM_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MIN
        value: "5"
      - key: RATE_LIMIT_DAILY
        value: "30"
